services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: edu_postgres
    environment:
      POSTGRES_DB: edu_database
      POSTGRES_USER: edu_user
      POSTGRES_PASSWORD: edu_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/init-db:/docker-entrypoint-initdb.d
    restart: unless-stopped
    command: >
      postgres 
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu_user -d edu_database"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edu_network

  # FastAPI Backend Application
  api:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    container_name: edu_api
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://edu_user:edu_password@postgres:5432/edu_database
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
      - ./Backend/uploads:/app/uploads
      - ./Backend/temp:/app/temp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - edu_network

  # React Frontend Application
  frontend:
    build: 
      context: ./Frontend/student-analysis-dashboard
      dockerfile: Dockerfile
    container_name: edu_frontend
    ports:
      - "3001:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - edu_network

  # Optional: PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: edu_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@edu.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - admin  # Only start with: docker-compose --profile admin up
    networks:
      - edu_network

volumes:
  postgres_data:
    driver: local

networks:
  edu_network:
    driver: bridge