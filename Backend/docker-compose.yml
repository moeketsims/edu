version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: edu_postgres
    environment:
      POSTGRES_DB: edu_database
      POSTGRES_USER: edu_user
      POSTGRES_PASSWORD: edu_password
      # Remove the trust method to use proper password authentication
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    restart: unless-stopped
    command: >
      postgres 
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu_user -d edu_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build: .
    container_name: edu_api
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://edu_user:edu_password@postgres:5432/edu_database
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro  # Mount app directory for development
      - ./main.py:/app/main.py:ro  # Mount main.py for development
      - ./uploads:/app/uploads  # Persistent uploads directory
      - ./temp:/app/temp        # Temporary processing directory
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: edu_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@edu.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - admin  # Only start with: docker-compose --profile admin up

volumes:
  postgres_data:
    driver: local

networks:
  default:
    driver: bridge 